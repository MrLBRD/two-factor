name: Veille upstream

# Surveille les releases de WordPress/two-factor.
# Toute la logique vit dans .github/scripts/upstream-watch.sh pour rester
# exécutable et testable en local (--dry-run).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les releases upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./.github/scripts/upstream-watch.sh
